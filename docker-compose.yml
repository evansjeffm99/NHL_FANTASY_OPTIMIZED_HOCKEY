version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nhl_postgres
    environment:
      POSTGRES_DB: nhl_fantasy
      POSTGRES_USER: nhl_user
      POSTGRES_PASSWORD: nhl_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhl_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nhl_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nhl_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://nhl_user:nhl_password@postgres:5432/nhl_fantasy
      - REDIS_URL=redis://redis:6379/0

  celery:
    build: ./backend
    container_name: nhl_celery
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    environment:
      - DATABASE_URL=postgresql://nhl_user:nhl_password@postgres:5432/nhl_fantasy
      - REDIS_URL=redis://redis:6379/0

  celery-beat:
    build: ./backend
    container_name: nhl_celery_beat
    command: celery -A core beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    environment:
      - DATABASE_URL=postgresql://nhl_user:nhl_password@postgres:5432/nhl_fantasy
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build: ./frontend
    container_name: nhl_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nhl_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
